name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify FastAPI app imports
        run: python -c "from app.main import app; assert app.title == 'AI Software Engineer Agent'"
      - name: Verify Docker image builds
        run: docker build -t ai-software-engineer-agent:ci .
